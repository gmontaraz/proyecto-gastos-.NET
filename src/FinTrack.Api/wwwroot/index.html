<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">FinTrack</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="userName"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Cerrar sesión</button>
        </div>
    </div>
</nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Resumen del mes</h2>
        <input type="month" class="form-control w-auto" id="monthInput">
    </div>

    <!-- Totales -->
    <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <div class="card summary-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Ingresos</p>
                    <h3 class="income" id="totalIncome">0 €</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card summary-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Gastos</p>
                    <h3 class="expense" id="totalExpenses">0 €</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card summary-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Balance</p>
                    <h3 id="balance">0 €</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Formulario nuevo movimiento -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">Añadir movimiento</div>
                <div class="card-body">
                    <form id="transactionForm">
                        <div class="mb-2">
                            <label class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="description" required>
                        </div>
                        <div class="row">
                            <div class="col mb-2">
                                <label class="form-label">Importe</label>
                                <input type="number" class="form-control" id="amount" step="0.01" min="0.01" required>
                            </div>
                            <div class="col mb-2">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" id="category" required></select>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header">Nueva categoría</div>
                <div class="card-body">
                    <form id="categoryForm" class="row g-2">
                        <div class="col-6">
                            <input type="text" class="form-control" id="categoryName" placeholder="Nombre" required>
                        </div>
                        <div class="col-4">
                            <select class="form-select" id="categoryType">
                                <option value="Expense">Gasto</option>
                                <option value="Income">Ingreso</option>
                            </select>
                        </div>
                        <div class="col-2">
                            <button type="submit" class="btn btn-secondary w-100">+</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Grafica -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header">Gastos por categoría</div>
                <div class="card-body">
                    <p class="text-muted" id="noData">No hay gastos este mes</p>
                    <div id="chartContainer">
                        <canvas id="chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla movimientos -->
    <div class="card">
        <div class="card-header">Movimientos</div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th class="text-end">Importe</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="transactionsTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
