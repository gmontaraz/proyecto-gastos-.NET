<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <h1 class="text-center mb-4">FinTrack</h1>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <div id="error" class="alert alert-danger d-none"></div>

                    <!-- Login -->
                    <form id="loginForm">
                        <h4 class="mb-3">Iniciar sesión</h4>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        <p class="mt-3 mb-0 text-center">
                            ¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a>
                        </p>
                    </form>

                    <!-- Registro -->
                    <form id="registerForm" class="d-none">
                        <h4 class="mb-3">Crear cuenta</h4>
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="registerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="registerEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="registerPassword" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Registrarme</button>
                        <p class="mt-3 mb-0 text-center">
                            <a href="#" id="showLogin">Ya tengo cuenta</a>
                        </p>
                    </form>

                </div>
            </div>

            <p class="text-muted text-center mt-3 small">
                Usuario de prueba: demo@fintrack.com / demo123
            </p>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
